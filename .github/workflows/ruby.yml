name: Ruby

on:
  pull_request:
    branches: [master]
  push:
    branches: [master,staging]

# Cancel superseded runs on the same PR; each push run gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      TEST_DB_HOST: localhost
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      TEST_DB_NAME: postgres
      RAILS_ENV: test

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Check out files
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
        env:
          BUNDLE_GEMS__CONTRIBSYS__COM: ${{ secrets.BUNDLE_GEMS__CONTRIBSYS__COM }}

      - name: Set up DB
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load

      - name: Dummy service credential
        run: cp spec/fixtures/service_account_cred.json.actions config/secure/service_account_cred.json

      - name: RSpec tests
        run: bundle exec rspec --color

      - name: Codecov upload
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out files
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
        env:
          BUNDLE_GEMS__CONTRIBSYS__COM: ${{ secrets.BUNDLE_GEMS__CONTRIBSYS__COM }}

      # -w2: block only on medium+ confidence findings.
      #
      # --ensure-latest dropped, and no proposer exists under the security-only
      # posture in .github/dependabot.yml (limit: 0): the flag would red every
      # PR on brakeman release day with nothing ever proposing the fix.
      #
      # -x UnscopedFind is INERT under -w2 and kept only as a guard: the check
      # hardcodes :confidence => :weak, which -w2 already drops at add_warning
      # time, so removing the flag today would produce byte-identical output.
      # It was load-bearing under the old default-confidence line; -w2 retired
      # it in the same commit. It exists so that dropping -w2 later does not
      # silently re-red this job. The fleet canary line carries no such flag.
      - name: Brakeman
        run: bundle exec brakeman -A -q --no-pager -w2 -x UnscopedFind

      - name: StandardRB
        run: bundle exec standardrb --format simple

  # Known-vulnerability status. NOT a required check, so a backlog never deadlocks
  # merges. Dependabot security-only opens the fixes it can; this is the visible
  # backstop, and groundcru's nightly rubysec sweep reports what Dependabot misses.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out files
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
        env:
          BUNDLE_GEMS__CONTRIBSYS__COM: ${{ secrets.BUNDLE_GEMS__CONTRIBSYS__COM }}

      - name: Bundle audit
        run: bin/bundler-audit check --update ${{ vars.CVE_IGNORES && format('--ignore {0}', vars.CVE_IGNORES) }}
